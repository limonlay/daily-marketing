<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;700&family=Big+Shoulders+Display:wght@900&family=Google+Sans:wght@400;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
.sc{position:absolute;inset:0;display:none}
.p{position:absolute;will-change:transform}
/* paper piece: flat colour + hard offset shadow (DESIGN.md allows only this kind) */
.paper{box-shadow:14px 14px 0 rgba(10,13,20,.9)}
.ht{position:absolute;inset:0}
.th{font-family:"Anuphan";font-weight:700;color:#14213d;padding:18px 40px;font-size:96px;white-space:nowrap}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.18}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <pattern id="dotP" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="11" cy="11" r="6" fill="#14213d"/></pattern>
  <pattern id="dotL" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="13" cy="13" r="7" fill="#e0b21a"/></pattern>
  <pattern id="dotK" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="8" cy="8" r="3.4" fill="#0a0d14"/></pattern>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .9 0"/></filter>
</defs></svg>

<!-- A: lemon field — money pieces assemble around the real app -->
<div class="sc" id="A" style="background:#ffd23f">
  <div class="p paper" id="a_blk" style="left:110px;top:300px;width:860px;height:1180px;background:#14213d;border-radius:0 140px 0 140px"></div>
  <svg class="p" id="a_dots" style="left:640px;top:160px" width="380" height="380"><circle cx="190" cy="190" r="190" fill="url(#dotP)"/></svg>
  <div class="p paper" id="a_ph" style="left:250px;top:380px;width:580px;background:#0a0d14;padding:26px;border-radius:0 80px 0 80px"><img src="shot-th-dark.webp" style="width:528px;display:block;border-radius:0 60px 0 60px"></div>
  <div class="p paper" id="a_rc" style="left:60px;top:1040px;width:300px;height:420px;background:#f2f0ea;padding:36px 30px">
    <div style="height:22px;background:#14213d;width:60%;margin-bottom:26px"></div>
    <div style="height:14px;background:#9a9890;margin-bottom:18px"></div><div style="height:14px;background:#9a9890;width:80%;margin-bottom:18px"></div>
    <div style="height:14px;background:#9a9890;width:90%;margin-bottom:18px"></div><div style="height:14px;background:#9a9890;width:70%;margin-bottom:40px"></div>
    <div style="height:30px;background:#14213d;width:50%;margin-left:auto"></div></div>
  <div class="p paper" id="a_c1" style="left:820px;top:1130px;width:190px;height:190px;border-radius:50%;background:#14213d;overflow:hidden"><svg class="ht" width="190" height="190"><rect width="190" height="190" fill="url(#dotL)"/></svg></div>
  <div class="p paper" id="a_c2" style="left:880px;top:1310px;width:130px;height:130px;border-radius:50%;background:#f2f0ea"></div>
  <img class="p" id="a_lem" src="lemon.svg" style="left:60px;top:150px;width:330px">
  <div class="p paper th" id="a_t1" style="left:120px;top:1560px;background:#f2f0ea">ทุกเหรียญ</div>
  <div class="p paper th" id="a_t2" style="left:470px;top:1700px;background:#14213d;color:#ffd23f">มีที่ไป</div>
</div>

<!-- B: prussian field — budget bars stack up, AI bubble -->
<div class="sc" id="B" style="background:#14213d">
  <svg class="p" id="b_dots" style="left:-120px;top:1100px" width="560" height="560"><circle cx="280" cy="280" r="280" fill="url(#dotL)"/></svg>
  <div class="p paper" id="b_b1" style="left:160px;bottom:620px;width:170px;height:360px;background:#ffd23f"></div>
  <div class="p paper" id="b_b2" style="left:370px;bottom:620px;width:170px;height:560px;background:#f2f0ea"></div>
  <div class="p paper" id="b_b3" style="left:580px;bottom:620px;width:170px;height:260px;background:#ffd23f;overflow:hidden"><svg class="ht" width="170" height="260"><rect width="170" height="260" fill="url(#dotP)"/></svg></div>
  <div class="p paper" id="b_b4" style="left:790px;bottom:620px;width:170px;height:460px;background:#f2f0ea;border-radius:0 85px 0 0"></div>
  <div class="p paper" id="b_q" style="left:120px;top:220px;width:700px;background:#f2f0ea;border-radius:0 70px 0 70px;padding:40px 50px;font-family:Anuphan;font-weight:500;font-size:58px;color:#14213d">เดือนนี้ค่าอาหารเท่าไหร่?</div>
  <div class="p paper" id="b_a" style="left:240px;top:450px;width:760px;background:#ffd23f;border-radius:70px 0 70px 0;padding:40px 50px;font-family:Anuphan;font-weight:700;font-size:64px;color:#14213d">ค่าอาหาร ฿4,280 ↓12%</div>
  <div class="p paper th" id="b_t" style="left:250px;top:1440px;background:#ffd23f;font-size:110px">ถาม AI ได้เลย</div>
</div>

<!-- C: cream field — halftone lemon + wordmark letters -->
<div class="sc" id="C" style="background:#f2f0ea">
  <svg class="p" id="c_dots" style="left:190px;top:330px" width="700" height="700"><circle cx="350" cy="350" r="350" fill="url(#dotL)"/></svg>
  <img class="p" id="c_lem" src="lemon.svg" style="left:250px;top:420px;width:580px">
  <div class="p paper" id="c_bar" style="left:140px;top:1180px;width:800px;height:300px;background:#14213d;border-radius:0 150px 0 150px"></div>
  <div id="c_word" style="position:absolute;left:0;right:0;top:1215px;display:flex;justify-content:center;gap:4px">
    <span class="p" style="position:relative;font-family:'Google Sans';font-weight:700;font-size:200px;color:#f2f0ea;letter-spacing:-.03em">D</span>
    <span class="p" style="position:relative;font-family:'Google Sans';font-weight:700;font-size:200px;color:#f2f0ea">a</span>
    <span class="p" style="position:relative;font-family:'Google Sans';font-weight:700;font-size:200px;color:#ffd23f">i</span>
    <span class="p" style="position:relative;font-family:'Google Sans';font-weight:700;font-size:200px;color:#f2f0ea">l</span>
    <span class="p" style="position:relative;font-family:'Google Sans';font-weight:700;font-size:200px;color:#f2f0ea">y</span>
  </div>
  <div class="p paper" id="c_url" style="left:260px;top:1580px;background:#ffd23f;padding:24px 50px;font-family:'Google Sans';font-weight:700;font-size:52px;color:#14213d;border-radius:0 40px 0 40px">daily.limonlay.com</div>
</div>
<svg id="grain" width="1080" height="1920"><rect width="1080" height="1920" filter="url(#noise)"/></svg>

<script>
// 128 BPM grid (matches the RuiC track): beat 0.46875 s, bar 1.875 s. Scenes = 3 bars, 3 bars, 2 bars.
const BEAT=60/128, $=id=>document.getElementById(id), cl=x=>Math.min(1,Math.max(0,x));
const SC=[['A',0,6*BEAT*2],['B',12*BEAT,24*BEAT],['C',24*BEAT,99]];
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=n=>{const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s)};
// a paper piece slides in from (dx,dy,dr) and lands exactly on beat `b` (relative to scene start)
function piece(el,t0,t,b,dx,dy,dr,dur=.35){
  const land=t0+b*BEAT, k=back((t-(land-dur))/dur), step=Math.floor(t*12);     // 12 fps stop-motion
  const j=t>=land?{x:(rnd(step+el.id.length)-.5)*3,r:(rnd(step*3)-.5)*.8}:{x:0,r:0}; // hand-placed jitter
  el.style.opacity=t<land-dur?0:1;
  el.style.transform=`translate(${dx*(1-k)+j.x}px,${dy*(1-k)}px) rotate(${dr*(1-k)+j.r}deg)`;
}
window.render=T=>{
  const t=Math.floor(T*12)/12;                                  // whole film steps at 12 fps
  for(const [id,a,b] of SC)$(id).style.display=T>=a&&T<b?'block':'none';
  const A=0;
  piece($('a_blk'),A,t,0,0,-1600,-8); piece($('a_dots'),A,t,1,600,-300,30);
  piece($('a_ph'),A,t,2,0,1500,6); piece($('a_rc'),A,t,4,-700,200,-25);
  piece($('a_c1'),A,t,5,500,300,40); piece($('a_c2'),A,t,6,400,400,-30);
  piece($('a_lem'),A,t,7,-500,-500,-40); piece($('a_t1'),A,t,8,-1100,0,-6); piece($('a_t2'),A,t,9,1100,0,5);
  const B=12*BEAT;
  piece($('b_dots'),B,t,0,-600,300,20);
  ['b_b1','b_b2','b_b3','b_b4'].forEach((id,i)=>piece($(id),B,t,1+i,0,1300,(i%2?6:-6)));
  piece($('b_q'),B,t,5,-1000,0,-5); piece($('b_a'),B,t,7,1000,0,5); piece($('b_t'),B,t,9,0,900,-4);
  const C=24*BEAT;
  piece($('c_dots'),C,t,0,0,-1300,0); piece($('c_lem'),C,t,1,0,-1500,-30);
  piece($('c_bar'),C,t,2,-1300,0,-4);
  [...document.querySelectorAll('#c_word span')].forEach((e,i)=>{e.id='w'+i;piece(e,C,t,3+i*.5,0,-900,(i%2?10:-10),.25)});
  piece($('c_url'),C,t,6,0,700,3);
  $('grain').style.transform=`translate(${(rnd(Math.floor(T*12))-.5)*40}px,0)`;  // grain flickers like film
};
render(0);
</script></body></html>
