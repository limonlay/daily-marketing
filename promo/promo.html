<!doctype html><html><head><meta charset="utf-8">
<link href="gf/p.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#14213d;font-family:"Google Sans","Noto Sans Thai",sans-serif;color:#fff}
.s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.big{font-size:118px;font-weight:800;line-height:1.15;text-align:center}
.mid{font-size:64px;font-weight:600;text-align:center;line-height:1.3}
.o{color:#fca311}
.phone{width:700px;height:1300px;border-radius:90px;background:#fff;color:#14213d;border:18px solid #0b1324;box-shadow:0 60px 140px rgba(0,0,0,.5);padding:90px 50px;position:relative;overflow:hidden}
.bar{font-size:44px;font-weight:700;margin-bottom:40px}
.inp{border:4px solid #fca311;border-radius:36px;padding:28px 34px;font-size:46px;min-height:120px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:44px;padding:26px 10px;border-bottom:3px solid #eef0f4}
.row b{font-weight:700}
.chip{display:inline-block;background:#fca311;color:#14213d;border-radius:30px;padding:6px 22px;font-size:32px;font-weight:700;margin-right:16px}
.cap{position:absolute;top:120px;left:0;right:0;font-size:70px;font-weight:800;text-align:center}
.slip{width:520px;height:700px;margin:0 auto;border-radius:30px;background:linear-gradient(#e8f6ee,#fff);border:3px solid #cde;padding:40px;font-size:38px;position:relative;overflow:hidden}
.scan{position:absolute;left:0;right:0;height:10px;background:#fca311;box-shadow:0 0 40px 10px #fca311}
</style></head><body>

<!-- 0-3s hook -->
<div class="s" id="s1">
  <div class="mid" id="h1">เงินเดือนออกวันที่ 1…</div>
  <div class="big o" id="cnt" style="font-size:190px;margin:40px 0">฿0</div>
  <div class="big" id="h2">หายไปไหนหมด?</div>
</div>

<!-- 3-6s type to record -->
<div class="s" id="s2">
  <div class="cap">พิมพ์ครั้งเดียว <span class="o">จดให้เลย</span></div>
  <div class="phone" style="margin-top:160px">
    <div class="bar">Daily<span class="o">฿</span></div>
    <div class="inp" id="typed"></div>
    <div id="rows2" style="margin-top:30px"></div>
  </div>
</div>

<!-- 6-9s slip scan -->
<div class="s" id="s3">
  <div class="cap">ถ่ายสลิป <span class="o">AI อ่านให้</span></div>
  <div class="phone" style="margin-top:160px">
    <div class="bar">สแกนสลิป</div>
    <div class="slip"><div style="font-weight:700;color:#0a7a3d">✓ โอนเงินสำเร็จ</div><br>ร้านหมูกระทะ<br><br><span style="font-size:80px;font-weight:800">฿ 459.00</span><br><br>8 ต.ค. 2569 19:42
      <div class="scan" id="scan"></div></div>
    <div class="row" id="slipRow" style="opacity:0"><span><span class="chip">อาหาร</span>หมูกระทะ</span><b>-฿459</b></div>
  </div>
</div>

<!-- 9-12s summary -->
<div class="s" id="s4">
  <div class="cap">รู้ทันที <span class="o">เงินไปไหน</span></div>
  <svg id="donut" width="760" height="760" viewBox="-1.2 -1.2 2.4 2.4" style="margin-top:120px;transform:rotate(-90deg)"></svg>
  <div id="legend" class="mid" style="font-size:52px;margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:20px 60px"></div>
</div>

<!-- 12-15s CTA -->
<div class="s" id="s5" style="background:#fca311;color:#14213d">
  <img src="icon-512.png" id="logo" style="width:300px;height:300px;border-radius:70px;margin-bottom:50px">
  <div class="big">Daily<span style="color:#fff">฿</span></div>
  <div class="mid" style="margin-top:30px">จดรายรับรายจ่ายใน 3 วิ<br>ใช้ฟรี ไม่ต้องติดตั้ง</div>
  <div class="mid" id="url" style="margin-top:70px;background:#14213d;color:#fff;border-radius:60px;padding:24px 60px">daily.limonlay.com</div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const win=(t,a,b,f=.25)=>cl((t-a)/f)*cl((b-t)/f); // fade in/out window
const CATS=[["อาหาร",.42,"#fca311"],["เดินทาง",.22,"#4ea8de"],["ช้อปปิ้ง",.2,"#e76f51"],["บิล",.16,"#8ecae6"]];
const TXT="กาแฟ 65 ข้าว 120 Grab 89";
const ITEMS=[["อาหาร","กาแฟ",65],["อาหาร","ข้าว",120],["เดินทาง","Grab",89]];
window.render=t=>{
  // s1 hook
  let o=win(t,0,3,.15);$('s1').style.opacity=o;
  $('h1').style.transform=`translateY(${(1-ease(t/.4))*80}px)`;
  const n=Math.round(25000*(1-ease((t-.3)/1.6)));
  $('cnt').textContent='฿'+n.toLocaleString();
  $('cnt').style.color=n<3000?'#ff5a5f':'#fca311';
  $('cnt').style.transform=`scale(${1+.15*Math.sin(t*40)*cl((t-1.9)/.1)*cl((2.4-t)/.1)})`;
  $('h2').style.opacity=cl((t-1.6)/.3);$('h2').style.transform=`scale(${.6+.4*back((t-1.6)/.4)})`;
  // s2
  $('s2').style.opacity=win(t,3,6);
  $('s2').style.transform=`translateY(${(1-ease((t-3)/.5))*300}px)`;
  const k=Math.floor(cl((t-3.3)/1.1)*TXT.length);
  $('typed').textContent=TXT.slice(0,k)+((t*3|0)%2&&k<TXT.length?'|':'');
  $('rows2').innerHTML=ITEMS.map((it,i)=>{const p=back((t-4.6-i*.25)/.35);
    return `<div class="row" style="opacity:${cl(p)};transform:translateX(${(1-p)*200}px)"><span><span class="chip">${it[0]}</span>${it[1]}</span><b>-฿${it[2]}</b></div>`}).join('');
  // s3
  $('s3').style.opacity=win(t,6,9);
  $('scan').style.top=(cl((t-6.4)/1.2)*690)+'px';$('scan').style.opacity=t<7.7?1:0;
  const r=back((t-7.7)/.4);$('slipRow').style.opacity=cl(r);$('slipRow').style.transform=`scale(${.5+.5*r})`;
  // s4
  $('s4').style.opacity=win(t,9,12);
  let acc=0,svg='';const g=ease((t-9.2)/1.3);
  for(const [nm,v,c] of CATS){const a0=acc*2*Math.PI,a1=Math.min(acc+v,g)*2*Math.PI;acc+=v;if(a1<=a0)continue;
    const L=a1-a0>Math.PI?1:0;svg+=`<path d="M${Math.cos(a0)} ${Math.sin(a0)}A1 1 0 ${L} 1 ${Math.cos(a1)} ${Math.sin(a1)}" fill="none" stroke="${c}" stroke-width=".38"/>`}
  $('donut').innerHTML=svg;
  $('legend').innerHTML=CATS.map(([nm,v,c],i)=>`<span style="opacity:${cl((t-10-i*.2)/.3)};color:${c};margin:0 18px">${nm} ${Math.round(v*100)}%</span>`).join('');
  // s5
  $('s5').style.opacity=cl((t-12)/.25);
  $('logo').style.transform=`scale(${back((t-12.1)/.5)})`;
  $('url').style.transform=`scale(${1+.06*Math.sin((t-13)*6)*cl(t-13)})`;
};
render(0);
</script></body></html>
