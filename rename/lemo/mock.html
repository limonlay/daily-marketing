<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lemo mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block">
<link rel="stylesheet" href="../../platforms/art/art.css">
<style>
  /* Lemo wordmarks: A = name + lemon (same build as Daily), B = the lemon is the "o", C = lowercase with the lemon as "o" */
  .lw { display: inline-flex; align-items: center; font-family: 'Google Sans', sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  .lw.A { gap: 0.18em; }
  .lw.A img { height: 0.82em; transform: translateY(-0.04em) rotate(-8deg); }
  .lw.B img, .lw.C img { height: 0.6em; margin-left: 0.03em; transform: translateY(0.1em) rotate(-8deg); }
  .lbl { font-family: 'Google Sans', 'Anuphan', sans-serif; font-weight: 600; }
  .hdrmask { position: absolute; background: #000; display: flex; align-items: center; }
  .hdrmask.light { background: #fbf9f5; }
  .ico { border-radius: 22.5%; overflow: hidden; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="mock.js"></script>
</body>
</html>
