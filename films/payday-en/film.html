<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=block" rel="stylesheet">
<style>
:root{--prussian:#14213d;--lemon:#ffd23f;--night:#0a0d14;--cream:#f2f0ea}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night);font-family:"Google Sans",sans-serif}
.sc{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.a{position:absolute;will-change:transform}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:700;letter-spacing:-.03em}
.app{position:absolute;left:0;top:0;width:600px;transform-origin:0 0}
</style></head><body>

<!-- 1 HOOK 0-4 beats -->
<section class="sc" id="s1" style="background:var(--lemon)">
  <div class="t a" id="w1" style="top:700px;font-size:230px;color:var(--prussian)">payday.</div>
  <img class="a" id="l1" src="lemon.svg" style="left:390px;top:1080px;width:300px">
</section>

<!-- 2 TURN 4-8 -->
<section class="sc" id="s2">
  <img class="app" id="a2" src="en.webp">
  <div class="a" style="left:0;top:0px;width:1080px;height:520px;background:var(--night)"></div>
  <div class="t a" id="w2" style="top:250px;font-size:170px;color:var(--cream)">…day 25.</div>
</section>

<!-- 3 PROOF 8-16 -->
<section class="sc" id="s3">
  <img class="app" id="a3" src="en.webp">
  <div class="a" style="left:0;top:0px;width:1080px;height:500px;background:var(--night)"></div>
  <div class="a" id="bar3" style="height:14px;background:var(--lemon);border-radius:0 7px 0 7px"></div>
  <div class="t a" id="w3" style="top:230px;font-size:120px;color:var(--cream)">where did it go?</div>
</section>

<!-- 4 PROOF 16-22: scan, then the new row with the app's lemon highlight -->
<section class="sc" id="s4a" style="background:var(--cream)">
  <div class="a" id="rc" style="left:250px;top:420px;width:580px;background:#fff;padding:60px 56px;box-shadow:24px 24px 0 var(--prussian);border-radius:0 70px 0 70px;color:var(--prussian)">
    <div style="font-size:56px;font-weight:700">Coffee House</div>
    <div style="display:flex;justify-content:space-between;font-size:48px;margin-top:36px"><span>Latte</span><span>4.50</span></div>
    <div style="display:flex;justify-content:space-between;font-size:60px;font-weight:700;margin-top:46px;background:var(--lemon);padding:18px 24px;border-radius:0 30px 0 30px"><span>Total</span><span>$4.50</span></div>
  </div>
  <div class="a" id="scan" style="left:220px;width:640px;height:18px;background:var(--lemon)"></div>
  <div class="t" style="top:1480px;font-size:110px;color:var(--prussian)">snap it.</div>
</section>
<section class="sc" id="s4b">
  <img class="app" id="a4" src="en.webp">
  <div class="a" id="hl" style="left:0;width:1080px;height:150px;background:var(--lemon)"></div>
  <div class="a" style="left:0;top:1140px;width:1080px;height:780px;background:var(--night)"></div>
  <div class="a" id="saved" style="left:0;right:0;top:1290px;display:flex;justify-content:center;align-items:center;gap:30px">
    <img id="l4" src="lemon.svg" style="width:180px"><span style="background:var(--lemon);color:var(--prussian);font-size:84px;font-weight:700;padding:22px 48px;border-radius:0 46px 0 46px">Saved</span></div>
  <div class="t a" id="w4" style="top:1600px;font-size:110px;color:var(--cream)">done.</div>
</section>

<!-- 5 PAYOFF 22-27 -->
<section class="sc" id="s5">
  <img class="app" id="a5" src="en.webp">
  <div class="a" style="left:0;top:1560px;width:1080px;height:360px;background:var(--night)"></div>
  <div class="t a" id="w5" style="top:1650px;font-size:130px;color:var(--lemon)">now you know.</div>
</section>

<!-- 6 CTA 27-32 -->
<section class="sc" id="s6" style="background:var(--prussian)">
  <img class="a" id="l6" src="lemon.svg" style="left:300px;top:520px;width:480px">
  <div class="t a" id="w6" style="top:960px;font-size:220px;color:var(--cream)">Daily</div>
  <div class="t a" id="u6" style="top:1220px;font-size:60px;font-weight:500;letter-spacing:0;color:var(--lemon)">daily.limonlay.com</div>
  <div class="t a" id="f6" style="top:1320px;font-size:46px;font-weight:500;letter-spacing:0;color:#9a9890">free · no ads · web app</div>
</section>

<script>
// 128 BPM grid; beat = 0.46875 s; 32 beats = 15 s. Motion follows the app's tokens (DESIGN.md):
// ease-out cubic-bezier(.2,.8,.2,1), one ~6% overshoot only on things that "happen", exits ~20% faster.
const BEAT = 60 / 128, tb = b => b * BEAT, $ = id => document.getElementById(id), cl = x => Math.min(1, Math.max(0, x));
const bez = (x1, y1, x2, y2) => x => { x = cl(x); let lo = 0, hi = 1, s = .5;          // cubic-bezier easing
  for (let i = 0; i < 24; i++) { s = (lo + hi) / 2; const bx = 3 * x1 * s * (1 - s) ** 2 + 3 * x2 * s * s * (1 - s) + s ** 3; bx < x ? lo = s : hi = s; }
  return 3 * y1 * s * (1 - s) ** 2 + 3 * y2 * s * s * (1 - s) + s ** 3; };
const easeOut = bez(.2, .8, .2, 1), spring = bez(.34, 1.4, .64, 1);                    // spring peaks ~6% over
const k = (t, at, d, e = easeOut) => e((t - at) / d);
// place the 600-px screenshot so that its point (px,py) lands on screen point (sx,sy) at scale S
const place = (el, px, py, sx, sy, S) => { el.style.transform = `translate(${sx - px * S}px,${sy - py * S}px) scale(${S})`; };
const lerp = (a, b, x) => a + (b - a) * x;
const SC = [['s1', 0, 4], ['s2', 4, 8], ['s3', 8, 16], ['s4a', 16, 19], ['s4b', 19, 22], ['s5', 22, 27], ['s6', 27, 99]];
// screenshot landmarks (in the 600 x 1298 image): balance card centre, category row, the coffee row
const CARD = [300, 330], CATS = [300, 590], CAT_X = [40, 106, 176, 244, 312], CAT_BOTTOM = 676, COFFEE = [300, 948];

window.render = t => {
  const b = t / BEAT;
  for (const [id, a, z] of SC) $(id).style.visibility = b >= a && b < z ? 'visible' : 'hidden';

  // 1 HOOK: the word lands already moving on frame 0; lemon drops in on beat 1 and bounces once
  $('w1').style.transform = `scale(${lerp(1.5, 1, k(t, 0, .32, spring))}) translateY(${-t * 14}px)`;
  const ld = k(t, tb(1), .45, spring);
  $('l1').style.transform = `translateY(${lerp(-900, 0, ld)}px) rotate(${lerp(-40, 0, ld)}deg)`;
  $('l1').style.opacity = t >= tb(1) ? 1 : 0;

  // 2 TURN: hard cut to the real balance card, slow push in, words rise on beat 5
  place($('a2'), CARD[0], CARD[1], 540, 1060, lerp(1.9, 2.05, cl((b - 4) / 4)));
  const w2 = k(t, tb(5), .32); $('w2').style.transform = `translateY(${(1 - w2) * 80}px)`; $('w2').style.opacity = w2;

  // 3 PROOF: camera glides from the card down to "Where it went"; a lemon bar marks one category per beat
  const g = k(t, tb(8), .8), S3 = 1.9, py3 = lerp(CARD[1], CATS[1], g);
  place($('a3'), 300, py3, 540, 1060, S3);
  const ci = Math.min(4, Math.max(0, Math.floor(b - 10)));
  const ox = 540 - 300 * S3, oy = 1060 - py3 * S3, bk = k(t, tb(10 + ci), .2);
  Object.assign($('bar3').style, { left: (ox + (CAT_X[ci] + 8) * S3) + 'px', top: (oy + CAT_BOTTOM * S3 + 12) + 'px',
    width: (52 * S3 * bk) + 'px', opacity: b >= 10 ? 1 : 0 });
  const w3 = k(t, tb(8.5), .32); $('w3').style.transform = `translateY(${(1 - w3) * 80}px)`; $('w3').style.opacity = w3;

  // 4a scan: the receipt lands, a lemon scan line sweeps it in ~1.2 s
  const r = k(t, tb(16), .35); $('rc').style.transform = `translateY(${(1 - r) * 140}px) rotate(${(1 - r) * -4}deg)`;
  const sc = cl((t - tb(16.5)) / 1.2); $('scan').style.top = lerp(400, 960, sc) + 'px'; $('scan').style.opacity = t > tb(16.5) && sc < 1 ? 1 : 0;
  // 4b the new row appears with the lemon highlight that fades in ~1.2 s; lemon bounces once + Saved
  place($('a4'), COFFEE[0], COFFEE[1], 540, 820, lerp(1.95, 1.85, cl((b - 19) / 3)));
  const S4 = lerp(1.95, 1.85, cl((b - 19) / 3));
  $('hl').style.top = (820 - 42 * S4) + 'px'; $('hl').style.height = (84 * S4) + 'px'; $('hl').style.opacity = .38 * (1 - cl((t - tb(19)) / 1.2));
  const sv = k(t, tb(20), .4, spring); $('saved').style.transform = `scale(${lerp(.6, 1, sv)})`; $('saved').style.opacity = cl((t - tb(20)) / .12);
  const w4 = k(t, tb(20.5), .3); $('w4').style.transform = `translateY(${(1 - w4) * 70}px)`; $('w4').style.opacity = w4;

  // 5 PAYOFF: pull back to the whole home screen; calm
  const p5 = k(t, tb(22), .9); place($('a5'), 300, 640 + cl((b - 24) / 3) * 60, 540, 820, lerp(2.4, 1.3, p5) * (1 - cl((b - 24) / 3) * .05));
  const w5 = k(t, tb(23), .32); $('w5').style.transform = `translateY(${(1 - w5) * 70}px)`; $('w5').style.opacity = w5;

  // 6 CTA: the lemon crashes in (one overshoot), wordmark + URL on beats, still drifting on the last frame
  const l6 = k(t, tb(27), .5, spring);
  $('l6').style.transform = `scale(${lerp(3, 1, l6)}) rotate(${lerp(-25, 0, l6) + Math.sin(t * 1.6) * 2}deg) translateY(${Math.sin(t * 2.1) * 10}px)`;
  [['w6', 28], ['u6', 29], ['f6', 29.5]].forEach(([id, bb]) => { const q = k(t, tb(bb), .32);
    $(id).style.transform = `translateY(${(1 - q) * 60}px)`; $(id).style.opacity = q; });
  $('s6').style.transform = `scale(${1 - cl((b - 27) / 5) * .05})`;
};
render(0);
</script></body></html>
